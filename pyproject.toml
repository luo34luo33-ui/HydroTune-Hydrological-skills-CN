[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hydrotune-skills-tools"
version = "0.1.0"
description = "Validation and installation tools for the HydroTune-skills repository"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
  "jsonschema>=4.18,<5",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
test = [
  "pytest>=8,<9",
]
spatial = [
  "geopandas>=0.14,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "pyproj>=3.6,<4",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
  "whitebox>=2.3,<3",
  "xarray>=2024.1,<2027",
  "netCDF4>=1.6,<2",
]
reporting = [
  "matplotlib>=3.7,<4",
  "scipy>=1.11,<2",
]
visualization = [
  "geopandas>=0.14,<2",
  "matplotlib>=3.7,<4",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "Pillow>=10,<13",
  "rasterio>=1.3,<2",
  "shapely>=2,<3",
]
timeseries = [
  "numpy>=1.24,<3",
  "openpyxl>=3.1,<4",
  "pandas>=2,<3",
  "pyarrow>=14,<24",
  "scipy>=1.11,<2",
  "XlsxWriter>=3.1,<4",
]
calibration = [
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scipy>=1.11,<2",
]
ml = [
  "joblib>=1.3,<2",
  "numpy>=1.24,<3",
  "pandas>=2,<3",
  "scikit-learn>=1.3,<4",
]
ml-xgboost = [
  "xgboost>=2,<3",
]

[tool.setuptools]
py-modules = []

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
  "integration: runs synthetic spatial or event end-to-end pipelines",
]
