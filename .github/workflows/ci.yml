name: CI

on:
  push:
  pull_request:

jobs:
  validate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.13"]

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install CJK font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install test dependencies
        run: python -m pip install -e ".[test,spatial,visualization,timeseries,calibration]"
      - name: Validate repository
        run: |
          python scripts/validate_skills.py
          python scripts/validate_workflows.py
      - name: Test
        run: python -m pytest -m "not integration"
      - name: Check Bash syntax
        if: runner.os != 'Windows'
        shell: bash
        run: bash -n install-common.sh install-codex.sh install-claude.sh install-opencode.sh
      - name: Check PowerShell syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem install-*.ps1 | ForEach-Object {
            [void][scriptblock]::Create((Get-Content -LiteralPath $_.FullName -Raw))
          }

  spatial-integration:
    name: Spatial integration / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CJK font
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - name: Install spatial test dependencies
        run: python -m pip install -e ".[test,spatial,visualization,timeseries,calibration]"
      - name: Run synthetic WhiteboxTools pipeline
        run: python -m pytest -m integration
